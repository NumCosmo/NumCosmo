[pytest]
# importlib import mode: pytest does not insert test directories onto sys.path, so a
# test module directory (e.g. math/) cannot shadow a stdlib/third-party module. Requires
# unique test-file basenames across the tree. See TESTING.md.
addopts = --import-mode=importlib -p no:randomly --timeout=900 --timeout-method=thread
# pytest-randomly is not a dependency and is absent from the CI conda locks, but where a
# developer happens to have it installed it activates itself, shuffling test order and
# reseeding random/numpy.random per test -- so local runs were not reproducible while CI
# runs were. Blocked here so both behave the same. `-p no:` is a no-op when the named
# plugin is absent, so this needs no dependency. The weekly flaky lane can re-enable it.
# Per-test timeout. Nothing killed a stuck test before this, so a worker that died
# mid-test left the xdist controller waiting and the whole lane hung (observed twice,
# 20+ min each, on the app lane). Sized from measured maxima under -O0 + gcov, which is
# the slowest lane by ~4x: acceptance 273 s, xcor 113 s, omp 75 s, default 73 s, the
# rest under 10 s. 900 s leaves ~3x headroom over the worst case for slower CI hardware
# while still turning a hang into a failure in a quarter of the time one used to burn.
# Per-lane overrides belong in tests/python/meson.build, not here.
#
# timeout-method=thread, not the default signal: SIGALRM is only delivered between
# Python bytecodes, so it cannot interrupt a test blocked inside a long C call, which is
# where this library spends nearly all of its time.
# Thread-traceback dumps for a single test running long are handled by our own
# pytest_runtest_protocol hook in conftest.py, not this builtin ini option --
# see the comment there for why (one-shot vs. repeating dumps).
# Markers, grouped by axis (see TESTING.md). This is the single source of marker
# declarations; conftest.py only wires the --run-* options and skip logic.
# Tier (cost/intent): unit is the default and is left UNMARKED.
markers =
    statistical: Seeded, tolerance-based numerics (off the fast lane)
    acceptance: Full integration / posterior-recovery tests (slowest)
    # Opt-in capabilities: runnable but skipped by default (gated by --run-* in conftest).
    powspec: Power-spectrum tests (run with --run-powspec)
    xcor: Cross-correlation tests (run with --run-xcor)
    mpi: MPI-parallel tests (run with --run-mpi)
    app: Application/CLI tests, incl. parallel ESMCMC (run with --run-app)
    planck_data: Needs a local plc_3.0 Planck tree (run with --run-planck-data)
    sphere_map: Sphere-map tests (run with --run-sphere-map)
    omp: Has an OpenMP-parallel path; additionally run in a dedicated OMP_NUM_THREADS>1 lane
    # Optional-dependency label: auto-skipped via pytest.importorskip when pyccl is absent.
    ccl: Cross-checks against pyccl (selection label; skipped automatically without pyccl)
