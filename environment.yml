---
name: numcosmo_developer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - astropy
  - black
  # pyccl pulls in camb, which is built against the gcc/gfortran 14 toolchain,
  # while the unpinned compiler metapackages resolve to 15 (c-compiler 2.x).
  # Reconciling the two costs the solver hours on linux-64; pin to the series
  # camb uses. Drop the pin once camb ships gcc 15 builds.
  - c-compiler <2
  - cfitsio
  - click
  - coverage
  - fftw
  - flake8
  - fortran-compiler <2  # see the c-compiler note above
  - gcovr
  - getdist
  - gi-docgen
  - glib
  - glib-tools
  - gmp
  - gobject-introspection
  - gsl>=2.8
  - hdf5
  - healpy
  - jupyter
  - lcov
  - libflint
  - matplotlib-base
  - meson
  - mpfr
  - mypy
  - networkx
  - ninja
  - nlopt
  - numpy
  - openblas=*=*openmp*
  - openmpi
  - pandas
  - pip
  - plotnine
  - pyccl >= 3.0.0
  - pydantic
  - pygobject
  - pygobject-stubs
  - pylint
  - pytest
  - pytest-cov
  - pytest-lazy-fixtures
  - pytest-timeout
  - pytest-xdist
  - python >= 3.11
  - quarto
  - requests
  - rich
  - scipy
  - setuptools
  - tabulate
  - tqdm
  - typer
  - types-tabulate
  - zlib
