name: Update conda lock files

# Refreshes .github/locks/*.lock (the pre-solved CI conda environments) against
# the current conda-forge and opens a pull request with the result. Runs weekly
# and on demand; see CONTRIBUTING.md, section "CI conda environment".

on:
  schedule:
    # Mondays, 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-locks:
    name: Regenerate lock files
    runs-on: ubuntu-latest
    # Solving takes seconds; a run that hits this cap means a new dependency
    # conflict is making the solver backtrack (see CONTRIBUTING.md), and should
    # fail rather than grind for hours.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Install conda-lock
        run: pip install conda-lock
      - name: Regenerate lock files
        run: python .github/scripts/conda_locks.py generate
      - name: Smoke test the linux-64 locks
        # Catches a lock file that solves but cannot be installed. The macOS
        # ones are only exercised when the pull request below runs CI.
        run: |
          for lock in .github/locks/conda-linux-64-*.lock; do
            echo "::group::$lock"
            conda create -y -n locktest --file "$lock"
            conda env remove -y -n locktest
            echo "::endgroup::"
          done
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-conda-locks
          delete-branch: true
          add-paths: .github/locks
          commit-message: 'CI: update conda lock files'
          title: 'CI: update conda lock files'
          body: |
            Weekly refresh of the pre-solved CI conda environments
            (`.github/locks/*.lock`), generated by
            `.github/scripts/conda_locks.py generate`.

            Pull requests opened by `GITHUB_TOKEN` do not start workflows:
            close and reopen this one to run the full build matrix against the
            new environments before merging.
