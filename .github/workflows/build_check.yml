name: Build and Check

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'

env:
  CONDA_ENV: numcosmo_developer
  # Bump to discard the cached data files (~470 MB of Planck/SNIa/weak-lensing
  # assets) and download them again. The cache also goes stale on its own when
  # the datafile release tag changes; this knob covers everything else, such as
  # a file replaced in place under an unchanged tag. See
  # .github/actions/data-cache.
  DATA_CACHE_VERSION: 0
  # Thread policy is set PER TEST by meson (tests/meson.build), not here: concurrent tests
  # get OMP/BLAS = 1 (avoid cores^2 oversubscription + the mixed-OpenBLAS deadlock, e.g.
  # scipy.linalg.solve in test_sbessel_ode_solver), and the run-alone OpenMP tests
  # (omp suite => is_parallel: false) get OMP_NUM_THREADS = cores so their `#pragma omp
  # parallel` branches actually run, inside the ordinary `meson test` invocation (see
  # TESTING.md). The globals below are just a single-thread fallback for the meson driver
  # and any non-test step; meson's per-test env overrides them.
  OMP_NUM_THREADS: 1
  OMP_MAX_ACTIVE_LEVELS: 1
  OMP_THREAD_LIMIT: 1
  OPENBLAS_NUM_THREADS: 1
  BLIS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  # Two sets, and every job runs exactly one of them plus optionally the other.
  #
  # FAST_TEST_ARGS is what runs on every build leg: the unit tiers. It is a deny-list so
  # that a newly added suite runs by default and has to be excluded deliberately; an
  # allow-list would let a new lane be skipped everywhere without notice.
  #
  # VALIDATION_TEST_ARGS is the tier that does not need repeating per platform: slow,
  # platform-independent physics and statistical validation. One leg runs it (see
  # build-miniforge), so it is named here rather than spelled out at the call site.
  #
  FAST_TEST_ARGS: "--no-suite py-app --no-suite py-acceptance --no-suite py-powspec --no-suite py-xcor --no-suite c-acceptance --no-suite c-statistical"
  VALIDATION_TEST_ARGS: "--suite py-acceptance --suite c-acceptance --suite c-statistical"
  # GitHub-hosted runners have no RDMA hardware, but the MPI stacks still probe for it.
  #  - OMPI_MCA_pml selects OpenMPI's ob1 point-to-point layer.
  #  - UCX_TLS restricts UCX itself (read by both OpenMPI's and MPICH's copies of the
  #    UCX library) to non-RDMA transports, which is what actually fixes the MPICH side
  #    (OMPI_MCA_* vars are OpenMPI-specific and MPICH silently ignores them).
  # Harmless no-op for jobs that never invoke mpiexec.
  OMPI_MCA_pml: "ob1"
  UCX_TLS: "tcp,self,sm"

jobs:

  lint:
    name: (lint)
    # Checks that read the source only, without building NumCosmo. Every check
    # step runs even when an earlier one fails, so one push reports them all.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        # Needs the merge base with the target branch to see only added lines.
        fetch-depth: 0
    # Fails when environment.yml was changed without regenerating
    # .github/locks/*.lock. The conda jobs below don't fail on a stale lock,
    # they fall back to solving it (slow), so this check is what makes the
    # mismatch visible. See CONTRIBUTING.md, section "CI conda environment".
    - name: Conda lock files
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/conda_locks.py check
    # Rejects evaluative wording in comments and docs, and reports theory-page
    # cross-references the branch drops. See CONTRIBUTING.md, section "Writing
    # style for comments and documentation".
    - name: Doc style
      if: ${{ !cancelled() }}
      run: ./.github/scripts/check_doc_style.sh --base origin/${{ github.base_ref || 'master' }}
    - name: Ensure clear Jupyter Notebooks
      if: ${{ !cancelled() }}
      uses: ResearchSoftwareActions/EnsureCleanNotebooksAction@1.1
    # uncrustify, black and ruff come from the lock environment. environment.yml
    # leaves them unpinned, so the weekly lock update moves them to their latest
    # release.
    - uses: ./.github/actions/setup-miniforge
      if: ${{ !cancelled() }}
      with:
        python-version: "3.13"
    - name: Checking indentation
      if: ${{ !cancelled() }}
      shell: bash -el {0}
      run: |
        find numcosmo -path numcosmo/external -prune -o \( -name '*.c' -o -name '*.h' \) -print0 \
          | xargs -0 uncrustify -c numcosmo_uncrustify.cfg --check -q
    - name: Running black check
      if: ${{ !cancelled() }}
      shell: bash -el {0}
      run: |
        black --check numcosmo_py
    - name: Running ruff
      if: ${{ !cancelled() }}
      shell: bash -el {0}
      run: |
        ruff check numcosmo_py

  lint-built:
    name: (lint, built)
    # Checks that run against a built and installed NumCosmo.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-miniforge
        with:
          python-version: "3.13"
      - name: Setting up NumCosmo
        run: |
          meson setup build -Dbuildtype=release -Dnumcosmo_py=true -Dfftw-planner=estimate --libdir=$CONDA_PREFIX/lib --prefix=$CONDA_PREFIX || (cat build/meson-logs/meson-log.txt && exit 1)
      - name: Building NumCosmo
        run: |
          meson compile -C build
      - name: Installing NumCosmo
        run: |
          meson install -C build
      # Regenerates nc.pyi and ncm.pyi from the installed typelibs and fails
      # if they differ from the committed stubs. To fix, build and run
      # numcosmo_py/update_pyi.sh, then commit the stubs.
      - name: Checking stubs are up to date
        if: ${{ !cancelled() }}
        run: |
          sh numcosmo_py/update_pyi.sh
          git diff --exit-code -- numcosmo_py/nc.pyi numcosmo_py/ncm.pyi
      - name: Running mypy
        if: ${{ !cancelled() }}
        run: |
          mypy -p numcosmo_py

  build-gcc-ubuntu:
    name: (ubuntu, apt, pip)
    # Pinned to 26.04, not ubuntu-latest: NumCosmo needs GSL >= 2.8 and 24.04
    # ships 2.7.1. Revisit once ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5
    - name: Restore data cache
      id: data-cache
      uses: ./.github/actions/data-cache
      with:
        version: ${{ env.DATA_CACHE_VERSION }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install pre-requisites
      uses: ./.github/actions/apt-deps
    - name: Pip install pre-requisites
      run: pip install -e ".[test]" meson ninja --break-system-packages
    - name: Configure NumCosmo
      run: meson setup build -Dbuildtype=release -Dnumcosmo_py=true -Dfftw-planner=estimate -Ddocumentation=false --prefix=/usr || (cat build/meson-logs/meson-log.txt && exit 1)
    - name: Building NumCosmo
      run: meson compile -C build
    - name: Prefetch data files
      # This job writes the Linux data cache, so it fetches every asset, not
      # only the ones its own tests read (see the step at the end of the job
      # and prefetch_data.py).
      if: steps.data-cache.outputs.hit != 'true'
      run: |
        source build/numcosmo_export.sh
        python3 .github/scripts/prefetch_data.py
    - name: Test python examples
      run: |
        source build/numcosmo_export.sh
        cd examples
        python example_simple.py
        python example_cbe.py
    - name: Test example compilation using non-installed library
      run: |
        source build/numcosmo_export.sh
        cd examples
        gcc -D_GNU_SOURCE -Wall example_simple.c -o example_simple -lnumcosmo -lgsl -lm $(pkg-config glib-2.0 gobject-2.0 --libs --cflags)
        gcc -D_GNU_SOURCE -Wall example_ca.c -o example_ca -lnumcosmo -lgsl -lm $(pkg-config glib-2.0 gobject-2.0 --libs --cflags)
        ./example_simple
        ./example_ca
    - name: Check NumCosmo
      # pip build job is a smoke test: exclude the parallel-ESMCMC app suite,
      # which deadlocks on the mixed pip/apt OpenBLAS stack. It is covered by the
      # conda coverage job (py-app shard) instead.
      run: meson test -v -C build --num-processes=$(getconf _NPROCESSORS_ONLN) ${{ env.FAST_TEST_ARGS }} || (cat build/meson-logs/testlog.txt && exit 1)
    - name: Create a NumCosmo tarball
      run: meson dist -C build --no-tests
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: build/meson-dist/numcosmo-*.tar.xz
    - name: Test example compilation using installed library
      run: |
        meson install -C build --destdir=install_tmp
        sudo cp -a build/install_tmp/* /
        cd examples
        gcc -D_GNU_SOURCE -Wall example_simple.c -o example_simple $(pkg-config numcosmo --libs --cflags)
        gcc -D_GNU_SOURCE -Wall example_ca.c -o example_ca $(pkg-config numcosmo --libs --cflags)
        ./example_simple
        ./example_ca
    - name: Save data cache
      # One writer per OS: every other Linux job restores this entry and never
      # writes one, so a job that downloads only its own slice of the assets
      # can never be what gets stored. Written only on success, since the key
      # is exact and a partial entry would then stick until DATA_CACHE_VERSION
      # is bumped.
      if: success() && steps.data-cache.outputs.hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.data-cache.outputs.paths }}
        key: ${{ steps.data-cache.outputs.key }}

  build-gcc-macos:
    name: (macos, brew, pip)
    runs-on: macos-latest
    env:
      CC: gcc-14
      FC: gfortran-14
      F77: gfortran-14
      F90: gfortran-14
      CPATH: /usr/local/include

    steps:
    - uses: actions/checkout@v5
    - name: Restore data cache
      id: data-cache
      uses: ./.github/actions/data-cache
      with:
        version: ${{ env.DATA_CACHE_VERSION }}
    - name: Brew install pre-requisites
      run: |
        # The runner image carries both pkgconf and the older pkg-config@0.29.2
        # formula, which conflict; removing the old one is the workaround found
        # in #169. Keep it before any step that queries pkg-config.
        brew uninstall --ignore-dependencies --force pkg-config@0.29.2
        brew install \
          gfortran meson ninja \
          glib gobject-introspection \
          gsl gmp mpfr fftw openblas nlopt \
          cfitsio \
          python3 pygobject3 numpy scipy python-matplotlib
        # The Python packages come from brew rather than being left to pip:
        # the pip step below then finds them already satisfied for brew's
        # interpreter instead of building them.
    - name: Export brew library paths
      run: |
        # gmp installs no pkg-config file, so pass its brew prefix to the linker.
        gmp_lib="$(brew --prefix gmp)/lib"
        for var in LIBRARY_PATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
          echo "${var}=/usr/local/lib:${gmp_lib}" >> "$GITHUB_ENV"
        done
    - name: Pip install pre-requisites
      run: |
        python3 -m pip install -e ".[test]" --break-system-packages
    - name: Configure NumCosmo
      run: |
        meson setup build -Dbuildtype=release -Dnumcosmo_py=true -Dfftw-planner=estimate -Dmpi=disabled --prefix=/usr || (cat build/meson-logs/meson-log.txt && exit 1)
    - name: Building NumCosmo
      run: |
        meson compile -C build
    - name: Prefetch data files
      # Writes the macOS data cache; see the same step in build-gcc-ubuntu.
      if: steps.data-cache.outputs.hit != 'true'
      run: |
        source build/numcosmo_export.sh
        python3 .github/scripts/prefetch_data.py
    - name: Test python examples
      run: |
        source build/numcosmo_export.sh
        cd examples
        python3 example_simple.py
        python3 example_cbe.py
    - name: Check NumCosmo
      run: |
        meson test -v -C build --num-processes=$(getconf _NPROCESSORS_ONLN) ${{ env.FAST_TEST_ARGS }} || (cat build/meson-logs/testlog.txt && exit 1)
    - name: Save data cache
      # The macOS writer; see the same step in build-gcc-ubuntu.
      if: success() && steps.data-cache.outputs.hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.data-cache.outputs.paths }}
        key: ${{ steps.data-cache.outputs.key }}

  build-miniforge:
    name: (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.mpi }}, Miniforge)
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: ["ubuntu", "macos"]
        python-version: ["3.13"]
        mpi: ["openmpi", "mpich"]
        exclude:
          - os: "macos"
            mpi: "openmpi"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - name: Restore data cache
        uses: ./.github/actions/data-cache
        with:
          version: ${{ env.DATA_CACHE_VERSION }}
      - uses: ./.github/actions/setup-miniforge
        with:
          python-version: ${{ matrix.python-version }}
          mpi: ${{ matrix.mpi }}
      - name: Setting up NumCosmo
        run: |
          meson setup build -Dbuildtype=release -Dnumcosmo_py=true -Dfftw-planner=estimate --libdir=$CONDA_PREFIX/lib --prefix=$CONDA_PREFIX || (cat build/meson-logs/meson-log.txt && exit 1)
      - name: Building NumCosmo
        run: |
          meson compile -C build
      - name: Installing NumCosmo
        run: |
          meson install -C build
          cd examples
          python example_simple.py
          python example_cbe.py
          numcosmo generate planck18 test_exp_gen.yaml --data-type TT
      - name: Check NumCosmo
        run: meson test -v -C build --num-processes=$(getconf _NPROCESSORS_ONLN) ${{ env.FAST_TEST_ARGS }} || (cat build/meson-logs/testlog.txt && exit 1)
      - name: Check NumCosmo (validation tier)
        # Slow, platform-independent validation, run on this leg only.
        if: matrix.os == 'ubuntu' && matrix.mpi == 'openmpi'
        run: meson test -v -C build ${{ env.VALIDATION_TEST_ARGS }} || (cat build/meson-logs/testlog.txt && exit 1)

  build-miniforge-coverage:
    name: Cov-${{ matrix.name }} (py${{ matrix.python-version }}, openmpi)
    runs-on: ${{ matrix.os }}-latest
    strategy:
      # Shards follow the lanes, not a hand-curated split (see TESTING.md). The Python
      # `pytest` lane is internally parallel (xdist), so it stays a single shard; the
      # marker-gated py-* subsets are their own shards because they are opt-in, not for
      # balancing.
      matrix:
        include:
          - { os: ubuntu, python-version: "3.13", name: python, args: "--suite python" }
          # omp-marked tests are excluded from the `python` suite (tests/python/meson.build),
          # where each would occupy one xdist worker at one thread; this shard runs them.
          - { os: ubuntu, python-version: "3.13", name: py-omp, args: "--suite py-omp" }
          - { os: ubuntu, python-version: "3.13", name: py-powspec, args: "--suite py-powspec" }
          - { os: ubuntu, python-version: "3.13", name: py-xcor, args: "--suite py-xcor" }
          - { os: ubuntu, python-version: "3.13", name: py-app, args: "--suite py-app" }
          # One shard: the C suite takes less wall time than the py-xcor shard. Split it
          # if it becomes the longest shard.
          - { os: ubuntu, python-version: "3.13", name: c, args: "--suite c" }
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - name: Restore data cache
        # Only these shards read downloaded data files; the others skip the ~470 MB
        # restore.
        if: contains(fromJSON('["python", "py-app"]'), matrix.name)
        uses: ./.github/actions/data-cache
        with:
          version: ${{ env.DATA_CACHE_VERSION }}
      - uses: ./.github/actions/setup-miniforge
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setting up NumCosmo
        run: |
          # conda's compiler activation adds -O2 and -D_FORTIFY_SOURCE=2, which meson
          # places after the buildtype flags. -O0, appended last, keeps the build
          # unoptimized: inlining breaks lcov 2.x's line records and drops inlined
          # functions from the report. -U_FORTIFY_SOURCE removes the glibc warning that
          # -O0 triggers in every translation unit; fortification needs -O anyway.
          export CFLAGS="$CFLAGS -O0 -U_FORTIFY_SOURCE"
          export CPPFLAGS="$CPPFLAGS -O0 -U_FORTIFY_SOURCE"
          export FFLAGS="$FFLAGS -O0"
          meson setup build -Dbuildtype=debug -Db_coverage=true -Dnumcosmo_py=true -Dfftw-planner=estimate -Dnumcosmo_debug=disabled --libdir=$CONDA_PREFIX/lib --prefix=$CONDA_PREFIX || (cat build/meson-logs/meson-log.txt && exit 1)
      - name: Building NumCosmo
        run: |
          meson compile -C build
      - name: Check and coverage
        # First run to generate the coverage base
        # Second run to generate the coverage for the tests
        # Third run to merge the coverage base and the coverage for the tests
        # The gcov data are all in build; numcosmo and tests are listed because
        # --no-external keeps only the sources under the listed directories.
        run: |
          lcov --config-file .lcovrc --no-external --capture --initial --directory build --directory numcosmo --directory tests --base-directory $(pwd)/build --output-file numcosmo-coverage-base.info
          meson test -v -C build --timeout-multiplier 3 --num-processes=$(getconf _NPROCESSORS_ONLN) ${{ matrix.args }} || (cat build/meson-logs/testlog.txt && exit 1)
          lcov --config-file .lcovrc --no-external --capture --directory build --directory numcosmo --directory tests --base-directory $(pwd)/build --output-file numcosmo-coverage-tests.info
          lcov --config-file .lcovrc --add-tracefile numcosmo-coverage-base.info --add-tracefile numcosmo-coverage-tests.info --output-file numcosmo-coverage-full.info
          # tests/c is the harness, not the library: a test file is covered by its own
          # execution, and counting it lifts the reported figure above what the library
          # actually reaches. The Python tests produce no gcov data.
          # numcosmo/**/tests/*.c holds installed helpers (the analytic xcor kernels)
          # and stays.
          lcov --config-file .lcovrc --remove numcosmo-coverage-full.info '*/external/*' '*/tools/*' '*/tests/c/*' --output-file numcosmo-coverage.info
      - name: Test timing summary
        if: always()
        # Lists this shard's slowest tests in the job summary; split a test that shows
        # up there rather than adding a shard.
        run: |
          python3 .github/scripts/test_summary.py summary --testlog build/meson-logs/testlog.json --title "${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: CodeCov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./numcosmo-coverage.info,./build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
