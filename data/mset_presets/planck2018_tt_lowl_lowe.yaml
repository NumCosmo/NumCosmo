    NcHIPrim:n_SA: 0.0056746939
    NcHIReion:z_re: 0.82391926
  fit:
    NcHICosmo:H0: true
    NcHICosmo:omegac: true
    NcHICosmo:omegab: true
    NcHIPrim:ln10e10ASA: true
