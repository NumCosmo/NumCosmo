# Checked against the PLA 68% tables (2018, v2), section 2.1, and
# Planck 2018 VI Tables 1 and 2.
NcmMSetPreset:
  desc: 'Planck 2018 results VI, A&A 641, A6 (2020), arXiv:1807.06209; PLA chains COM_CosmoParams_base-plikHM_R3.01, base_plikHM_TT_lowl_lowE'
  data-combination: 'Planck 2018 TT+lowE'
  statistic: 'best fit'
  reparam:
    NcHICosmo: 'NcHICosmoDEReparamCMB'
  value:
    NcHICosmo:H0: 66.85791  # H0
    NcHICosmo:omegac: 0.1206815  # omegach2
    NcHICosmo:omegab: 0.0221258  # omegabh2
    NcHIPrim:ln10e10ASA: 3.041305  # logA
    NcHIPrim:n_SA: 0.963515  # ns
    NcHIReion:z_re: 7.542419  # zrei
    NcHICosmo:Omegak: 0.0  # omegak, base_plikHM_TT_lowl_lowE.ranges
