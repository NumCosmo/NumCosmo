    NcHICosmo:Tgamma0: 2.7255  # T_CMB [K], Planck 2018 VI (Fixsen 2009)
    NcHICosmo:massnu_0: 0.06  # mnu [eV], base_plikHM_TT_lowl_lowE.ranges
    NcHICosmo:ENnu: 2.0328  # nnu = 3.046 minus 1.0132 of the massive nu, base_plikHM_TT_lowl_lowE.ranges
